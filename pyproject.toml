[project]
name = "factored"
version = "0.1.0"
description = "Factored AI & Data Hackathon 2026 — AI-first banking customer-service system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av<19",  # faster-whisper 1.2.1 calls av.open() with an argument PyAV 19 removed
    "boto3>=1.43.103",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "fastmcp>=4.0.10",
    "httpx>=0.28.1",
    "kokoro-onnx>=0.6.1",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-ollama>=1.1.0",
    "langfuse>=4.15.6",
    "langgraph>=1.2.12",
    "pandera>=0.33.1",
    "polars>=1.44.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "python-telegram-bot>=22.8",
    "sqlglot>=30.20.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "data_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "data_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app", "."]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "seaborn>=0.13.2",
]
