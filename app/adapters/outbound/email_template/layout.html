<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#E9EFEF;-webkit-text-size-adjust:100%;">
<!-- The line shown next to the subject in the inbox list; invisible in the message. -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;font-size:1px;line-height:1px;">{{ preheader }}</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#E9EFEF;">
 <tr><td align="center" style="padding:28px 12px;">

  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;">

   <!-- Header: the logo on its own dark band, and a thin line of the brand's green -->
   <tr><td align="left" bgcolor="#061319" style="background:#061319;border-radius:18px 18px 0 0;padding:6px 20px 6px 20px;">
     <img src="{{ logo_src }}" width="220" alt="quipu" style="display:block;width:220px;max-width:100%;height:auto;border:0;outline:none;">
   </td></tr>
   <tr><td bgcolor="#60C0B4" height="4" style="background:#60C0B4;height:4px;line-height:4px;font-size:0;">&nbsp;</td></tr>

   <!-- Body -->
   <tr><td bgcolor="#FFFFFF" style="background:#FFFFFF;padding:34px 38px 30px 38px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#28383F;font-size:16px;line-height:1.6;">
     <div style="font-size:12px;line-height:16px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#17766A;margin:0 0 10px 0;">{{ eyebrow }}</div>
     {{ body }}
   </td></tr>

   <!-- Footer -->
   <tr><td bgcolor="#F4F8F8" style="background:#F4F8F8;border-radius:0 0 18px 18px;padding:20px 38px 24px 38px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#5B6B70;border-top:1px solid #E1E9E9;">
     {{ footer }}
   </td></tr>

  </table>

 </td></tr>
</table>
</body>
</html>
