<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Geist"; font-weight: 400; src: url("public/fonts/geist-400.woff2") format("woff2"); }
        @font-face { font-family: "Geist"; font-weight: 500; src: url("public/fonts/geist-500.woff2") format("woff2"); }
        @font-face { font-family: "Geist"; font-weight: 600; src: url("public/fonts/geist-600.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; color: #EAF4F0; font-family: "Geist", sans-serif;
          background: radial-gradient(circle at 70% 50%, #0F2A2C 0, transparent 55%),
                      radial-gradient(#16292C 1.6px, transparent 1.6px) 0 0 / 48px 48px, #071316; }
        #s02-top { position: absolute; top: 56px; left: 120px; right: 120px; display: flex; justify-content: space-between; align-items: center; }
        #s02-brand { display: flex; gap: 16px; align-items: center; font-weight: 600; font-size: 36px; letter-spacing: -.02em; }
        #s02-brand img { width: 48px; height: 48px; }
        #s02-a { position: absolute; inset: 0; will-change: transform; }
        #s02-kick { position: absolute; top: 230px; left: 120px; display: inline-flex; gap: 14px; align-items: center; padding: 12px 26px; border: 1.5px solid #1F3A3D; border-radius: 999px; background: rgba(13,29,33,.7); font-size: 22px; opacity: 0; }
        #s02-kick::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #E8846B; }
        #s02-stats { position: absolute; top: 380px; left: 120px; right: 120px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 60px; }
        .s02-stat { opacity: 0; will-change: transform; }
        .s02-stat b { display: block; font-size: 150px; letter-spacing: -.055em; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; transform-origin: left bottom; will-change: transform; }
        .s02-stat b.alert { color: #E8846B; } .s02-stat b.blue { color: #6D9EE6; } .s02-stat b.teal { color: #5CC8B4; }
        .s02-stat span { display: block; font-size: 30px; line-height: 1.3; color: #9DB3AF; margin-top: 22px; max-width: 480px; }
        #s02-src { position: absolute; left: 120px; bottom: 90px; font-size: 18px; color: #7E9894; opacity: 0; }
        #s02-b { position: absolute; inset: 0; }
        #s02-radial { position: absolute; right: -120px; top: 50%; width: 980px; height: 980px; margin-top: -490px; opacity: 0; will-change: transform; transform-origin: center; }
        #s02-radial img { width: 100%; height: 100%; display: block; }
        #s02-meet { position: absolute; left: 120px; top: 300px; font-size: 168px; line-height: .92; letter-spacing: -.055em; font-weight: 600; }
        #s02-meet .w { display: inline-block; opacity: 0; margin-right: .18em; will-change: transform; }
        #s02-lead { position: absolute; left: 124px; top: 530px; width: 860px; font-size: 34px; line-height: 1.45; color: #9DB3AF; opacity: 0; will-change: transform; }
        #s02-lead b { color: #EAF4F0; font-weight: 500; }
        #s02-chips { position: absolute; left: 120px; top: 780px; display: flex; gap: 18px; }
        .s02-chip { display: inline-flex; gap: 12px; align-items: center; padding: 14px 24px; border: 1.5px solid #1F3A3D; border-radius: 999px; background: rgba(13,29,33,.8); font-size: 24px; opacity: 0; will-change: transform; }
        .s02-chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #5CC8B4; }
      </style>
      <div id="root" data-composition-id="s02-numbers" data-width="1920" data-height="1080" data-start="0" data-duration="19">
        <div id="s02-b">
          <div id="s02-radial"><img src="public/ds/quipu-radial.svg" alt="" /></div>
          <h1 id="s02-meet"><span class="w" data-layout-allow-overlap>Meet</span><span class="w" data-layout-allow-overlap>Quipu.</span></h1>
          <p id="s02-lead"><b>The agent that answers your bank's customers at 11 p.m.</b> It checks the bank's own data, and it acts, with every decision verified by code and confirmed by the customer.</p>
          <div id="s02-chips"><span class="s02-chip">Voice · text · photo</span><span class="s02-chip">Spanish · Portuguese</span><span class="s02-chip">Acts, with one tap to confirm</span></div>
        </div>
        <div id="s02-a">
          <div id="s02-kick">Lucía is not alone · 67,095 complaints · 2023–2026</div>
          <div id="s02-stats">
            <div class="s02-stat" id="s02-s1"><b class="alert" id="s02-n1">0.0 M</b><span>USD claimed by customers, still open</span></div>
            <div class="s02-stat" id="s02-s2"><b class="blue" id="s02-n2">0 M</b><span>USD in declined transactions over 3 years, each one a question</span></div>
            <div class="s02-stat" id="s02-s3"><b class="teal" id="s02-n3">0%</b><span>arrive outside office hours, when nobody answers</span></div>
          </div>
          <div id="s02-src">Organizer data, 2023–2026 · 67,095 complaints · 1 in 3 is a charge explainable in seconds · USD 370 M declined, 148 M pending, 74 M reversed</div>
        </div>
        <div id="s02-top"><div id="s02-brand"><img src="public/ds/quipu-logo.svg" alt="" /><span>quipu</span></div></div>
      </div>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#s02-kick", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);
          function stat(wrap, id, to, fmt, at) {
            tl.fromTo(wrap, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at);
            if (id) { var el = document.getElementById(id), st = { v: 0 };
              tl.to(st, { v: to, duration: 1.1, ease: "power2.out", onUpdate: function () { el.textContent = fmt(st.v); } }, at);
              tl.fromTo(el, { scale: 0.7 }, { scale: 1, duration: 1.1, ease: "power2.out" }, at); }
          }
          stat("#s02-s1", "s02-n1", 3.8, function (v) { return v.toFixed(1) + " M"; }, 0.5);
          stat("#s02-s2", "s02-n2", 370, function (v) { return Math.round(v) + " M"; }, 2.8);
          stat("#s02-s3", "s02-n3", 65, function (v) { return Math.round(v) + "%"; }, 5.6);
          tl.fromTo("#s02-src", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 6.6);
          var T = 9.4;
          tl.to("#s02-a", { opacity: 0, y: -40, duration: 0.6, ease: "power2.in" }, T - 0.3);
          tl.fromTo("#s02-radial", { opacity: 0, scale: 0.7, rotation: -14 }, { opacity: 1, scale: 1, rotation: 0, duration: 1.6, ease: "power3.out" }, T);
          tl.to("#s02-radial", { rotation: 8, duration: 8, ease: "none" }, T + 1.6);
          var words = gsap.utils.toArray("#s02-meet .w"), t = T + 0.25;
          words.forEach(function (w) { tl.set(w, { opacity: 1, y: 90 }, t); tl.to(w, { y: 0, duration: 0.22, ease: "power4.out" }, t); t += 0.2; });
          tl.fromTo("#s02-lead", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, T + 1.3);
          gsap.utils.toArray(".s02-chip").forEach(function (c, i) { tl.fromTo(c, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T + 4.6 + i * 0.25); });
          window.__timelines["s02-numbers"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
