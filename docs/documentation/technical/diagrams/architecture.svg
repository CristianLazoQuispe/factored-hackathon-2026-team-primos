<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 820" width="1480" height="820" role="img" aria-label="Component architecture">
  <!-- Component view of the system as deployed from main (not a flow). Every box is built.
       Hand-drawn on a grid: edit this file, then run `make diagrams` to regenerate architecture.png. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d3d3a"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
      .group { fill: #f7f7f5; stroke: #d0cfc9; }
      .group-title { font-size: 12px; font-weight: 600; fill: #52514e; letter-spacing: 0.6px; text-anchor: start; }
      .built { fill: #eef4fc; stroke: #2a78d6; stroke-width: 1.5; }
      .name { font-size: 14px; font-weight: 600; fill: #0b0b0b; }
      .note { font-size: 11.5px; fill: #52514e; }
      .edge { fill: none; stroke: #3d3d3a; stroke-width: 1.3; }
    </style>
  </defs>
  <rect width="1480" height="820" fill="#ffffff"/>

  <!-- Groups -->
  <rect class="group" x="590" y="30" width="200" height="120" rx="6"/>
  <text class="group-title" x="606" y="54">OBSERVABILITY</text>
  <rect class="group" x="30" y="190" width="220" height="416" rx="6"/>
  <text class="group-title" x="46" y="214">CHANNELS</text>
  <rect class="group" x="310" y="190" width="480" height="416" rx="6"/>
  <text class="group-title" x="326" y="214">BACKEND · FASTAPI</text>
  <rect class="group" x="850" y="190" width="260" height="416" rx="6"/>
  <text class="group-title" x="866" y="214">TOOLS · MCP SERVERS</text>
  <rect class="group" x="1170" y="190" width="280" height="416" rx="6"/>
  <text class="group-title" x="1186" y="214">DATA</text>
  <rect class="group" x="310" y="660" width="680" height="130" rx="6"/>
  <text class="group-title" x="326" y="684">AI MODELS</text>
  <rect class="group" x="1010" y="660" width="440" height="130" rx="6"/>
  <text class="group-title" x="1026" y="684">PLATFORM · GOOGLE CLOUD</text>

  <!-- Edges: channels → backend -->
  <path class="edge" d="M230,281 H329" marker-end="url(#arrow)"/>
  <path class="edge" d="M230,415 H280 V359 H329" marker-end="url(#arrow)"/>
  <path class="edge" d="M280,415 V515"/>
  <path class="edge" d="M280,437 H329" marker-end="url(#arrow)"/>
  <path class="edge" d="M280,515 H329" marker-end="url(#arrow)"/>
  <!-- backend internals -->
  <path class="edge" d="M510,359 H589" marker-end="url(#arrow)"/>
  <path class="edge" d="M650,328 V281 H511" marker-end="url(#arrow)"/>
  <path class="edge" d="M690,328 V137" marker-end="url(#arrow)"/>
  <path class="edge" d="M680,424 V499" marker-end="url(#arrow)"/>
  <!-- agent → tools -->
  <path class="edge" d="M770,376 H820"/>
  <path class="edge" d="M820,376 V261 H869" marker-end="url(#arrow)"/>
  <path class="edge" d="M820,335 H869" marker-end="url(#arrow)"/>
  <path class="edge" d="M820,376 H869" marker-end="url(#arrow)"/>
  <path class="edge" d="M820,376 V490 H869" marker-end="url(#arrow)"/>
  <!-- tools → Postgres -->
  <path class="edge" d="M1090,261 H1140 V335"/>
  <path class="edge" d="M1090,335 H1189" marker-end="url(#arrow)"/>
  <path class="edge" d="M1090,409 H1140 V335"/>
  <path class="edge" d="M1090,490 H1140 V409"/>
  <path class="edge" d="M1310,500 V440" marker-end="url(#arrow)"/>
  <!-- backend → models -->
  <path class="edge" d="M420,546 V704" marker-end="url(#arrow)"/>
  <path class="edge" d="M420,640 H565 V704" marker-end="url(#arrow)"/>
  <path class="edge" d="M589,400 H570 V625 H915 V704" marker-end="url(#arrow)"/>
  <path class="edge" d="M750,625 V704" marker-end="url(#arrow)"/>
  <!-- CI → Cloud Run -->
  <path class="edge" d="M1250,740 H1212" marker-end="url(#arrow)"/>

  <!-- Observability -->
  <rect class="built" x="620" y="74" width="140" height="62" rx="4"/>
  <text class="name" x="690" y="101">Langfuse</text>
  <text class="note" x="690" y="119">masked LLM traces</text>

  <!-- Channels -->
  <rect class="built" x="50" y="250" width="180" height="62" rx="4"/>
  <text class="name" x="140" y="277">Operator console</text>
  <text class="note" x="140" y="295">/consola · case files · take over</text>
  <rect class="built" x="50" y="367" width="180" height="96" rx="4"/>
  <text class="name" x="140" y="400">Web app · Next.js</text>
  <text class="note" x="140" y="419">chat · text, voice, image</text>
  <text class="note" x="140" y="435">my finances · sign-in</text>

  <!-- Backend -->
  <rect class="built" x="330" y="250" width="180" height="62" rx="4"/>
  <text class="name" x="420" y="277">Human handoff</text>
  <text class="note" x="420" y="295">case file · operator replies</text>
  <rect class="built" x="330" y="328" width="180" height="62" rx="4"/>
  <text class="name" x="420" y="355">Chat API</text>
  <text class="note" x="420" y="373">JWT session · chat memory</text>
  <rect class="built" x="330" y="406" width="180" height="62" rx="4"/>
  <text class="name" x="420" y="433">Finances API</text>
  <text class="note" x="420" y="451">spending · duplicate charges</text>
  <rect class="built" x="330" y="484" width="180" height="62" rx="4"/>
  <text class="name" x="420" y="511">Speech API</text>
  <text class="note" x="420" y="529">transcribe · synthesize</text>
  <rect class="built" x="590" y="328" width="180" height="96" rx="4"/>
  <text class="name" x="680" y="364">Agent · LangGraph</text>
  <text class="note" x="680" y="383">guard → router → skills</text>
  <text class="note" x="680" y="399">SKILL.md · identity from the JWT</text>
  <rect class="built" x="590" y="500" width="180" height="62" rx="4"/>
  <text class="name" x="680" y="522">E-mail</text>
  <text class="note" x="680" y="539">receipts · balance summaries</text>
  <text class="note" x="680" y="554">SMTP, or stored in ops.outbox</text>

  <!-- Tools -->
  <rect class="built" x="870" y="230" width="220" height="62" rx="4"/>
  <text class="name" x="980" y="257">Accounts</text>
  <text class="note" x="980" y="275">balances · debts · profile</text>
  <rect class="built" x="870" y="304" width="220" height="62" rx="4"/>
  <text class="name" x="980" y="325">Data warehouse lookup</text>
  <text class="note" x="980" y="342">movements · spending · complaints</text>
  <text class="note" x="980" y="357">read-only SQL, scoped to one customer</text>
  <rect class="built" x="870" y="378" width="220" height="62" rx="4"/>
  <text class="name" x="980" y="405">Charge investigation</text>
  <text class="note" x="980" y="423">duplicate · pending · FX · fraud</text>
  <rect class="built" x="870" y="452" width="220" height="76" rx="4"/>
  <text class="name" x="980" y="475">Actions · khipear</text>
  <text class="note" x="980" y="493">cards · disputes · transfers · bills</text>
  <text class="note" x="980" y="509">propose → confirm → execute → verify</text>

  <!-- Data -->
  <path class="built" d="M1190,264 a120,14 0 0 1 240,0 v160 a120,14 0 0 1 -240,0 z"/>
  <path class="built" d="M1190,264 a120,14 0 0 0 240,0" fill="none"/>
  <text class="name" x="1310" y="308">Postgres</text>
  <text class="note" x="1310" y="331">core: customers · products · transactions</text>
  <text class="note" x="1310" y="347">billing · complaints · fx_rates</text>
  <text class="note" x="1310" y="370">ops: audit · actions · transfers</text>
  <text class="note" x="1310" y="386">conversations · outbox</text>
  <rect class="built" x="1190" y="500" width="240" height="70" rx="4"/>
  <text class="name" x="1310" y="524">Data pipeline</text>
  <text class="note" x="1310" y="542">S3 → bronze → silver</text>
  <text class="note" x="1310" y="558">dedup · contracts · load</text>

  <!-- AI models -->
  <rect class="built" x="330" y="705" width="140" height="62" rx="4"/>
  <text class="name" x="400" y="732">Speech-to-text</text>
  <text class="note" x="400" y="750">Whisper · ES &amp; PT</text>
  <rect class="built" x="485" y="705" width="160" height="62" rx="4"/>
  <text class="name" x="565" y="732">Text-to-speech</text>
  <text class="note" x="565" y="750">Kokoro · ES &amp; PT</text>
  <rect class="built" x="660" y="705" width="180" height="62" rx="4"/>
  <text class="name" x="750" y="732">LLM · Gemini 2.5</text>
  <text class="note" x="750" y="750">Vertex AI · text, image, OCR</text>
  <rect class="built" x="855" y="705" width="120" height="62" rx="4"/>
  <text class="name" x="915" y="732">LLM · Ollama</text>
  <text class="note" x="915" y="750">local dev</text>

  <!-- Platform -->
  <rect class="built" x="1030" y="705" width="180" height="70" rx="4"/>
  <text class="name" x="1120" y="727">Cloud Run</text>
  <text class="note" x="1120" y="745">factored-api · factored-web</text>
  <text class="note" x="1120" y="760">Cloud SQL · Postgres 16</text>
  <rect class="built" x="1250" y="705" width="180" height="70" rx="4"/>
  <text class="name" x="1340" y="727">GitHub Actions</text>
  <text class="note" x="1340" y="745">lint · 990 tests · eval gate</text>
  <text class="note" x="1340" y="760">push to main → deploy</text>
</svg>
