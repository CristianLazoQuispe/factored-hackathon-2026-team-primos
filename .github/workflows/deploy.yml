name: CI and deploy to Cloud Run

# Pull requests: lint + tests. Push to main: lint + tests, then the eval-gate (Gemini answers the
# regression questions and the result must clear the floor in evals/text_to_sql/baseline.json),
# then deploy factored-api and factored-web, the same steps as `make deploy-api` /
# `make deploy-web` (Makefile), but automatic. A worse agent never reaches either service.
# Config: repository *variables* (Settings > Secrets and variables > Actions > Variables).
# GCP access: Workload Identity Federation, no stored key. Setup: docs/documentation/technical/deploy.md

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_eval_gate:
        description: "Deploy even if the quality floor fails (emergencies only; the run says so)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/factored

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the email check reads every commit
      # Every commit carries a team email, as author and as committer. One line per email in
      # .github/allowed-emails (noreply@github.com is the committer of merges made on github.com).
      - run: |
          ! git log --format='%ae%n%ce' ${{ github.event.pull_request.head.sha || github.sha }} \
            | sort -u | grep -vxFf .github/allowed-emails
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app tests data_pipeline evals
      - run: uv run ruff format --check app tests data_pipeline evals
      # Tests that need the demo Postgres skip themselves when it is not running.
      - run: uv run pytest -q

  # Runs the regression questions through Gemini on Vertex three times, judged together (one run of
  # the same agent varies by 10 points or more), and compares the result with the floor.
  # Exit codes of the gate: 0 pass, 1 fail, 2 proves nothing (the provider refused too many calls).
  # A run that proves nothing is tried once more; if it still proves nothing the deploy stops.
  # From a branch (Run workflow) only this job runs: it is how to try it without deploying.
  eval-gate:
    needs: test
    if: github.event_name != 'pull_request' && !inputs.skip_eval_gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    services:
      db:
        image: postgres:16-alpine # the same as docker-compose.yml
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      LLM_PROVIDER: google_genai
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_LOCATION: global # fewer 429s than a region; production uses ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # The same two steps as `make demo-data`, against the service container above.
      - run: uv run python -m data_pipeline.silver --source sample
      - run: uv run python -m data_pipeline.load
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - name: Run the evals and check the floor
        shell: bash
        run: |
          code=0
          for attempt in 1 2; do
            uv run python -m evals.text_to_sql.run --repeats 3 --out results/gate.json \
              || echo "the run ended early (exit $?): the floor decides what that means"
            code=0
            uv run python -m evals.text_to_sql.gate results/gate.json | tee gate.txt || code=$?
            if [ "$code" -ne 2 ]; then break; fi
            if [ "$attempt" -eq 1 ]; then
              echo "the run proved nothing: waiting 90 s before the one retry"
              sleep 90
            fi
          done
          { echo '### Quality floor'; echo '```'; cat gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: results/gate.json
          if-no-files-found: ignore

  deploy-api:
    needs: [test, eval-gate]
    # always(): when the gate is skipped on purpose (skip_eval_gate) this job still has to run.
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      (needs.eval-gate.result == 'success' ||
      (needs.eval-gate.result == 'skipped' && inputs.skip_eval_gate))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
      DEMO_IDS: ${{ vars.DEMO_CUSTOMER_IDS }}
      # Actions the customer confirms. Off unless the repository variable says true.
      ACTIONS_ENABLED: ${{ vars.ACTIONS_ENABLED }}
      # Khipear (transfers and payments). Off unless the repository variable says true: it needs
      # a core loaded with account numbers and ops.transfers (make etl-cloud).
      KHIPU_ENABLED: ${{ vars.KHIPU_ENABLED }}
      # The chat remembers each customer's earlier conversations. Off unless the variable says true;
      # it needs migrations/003_chat_memory.sql applied to Cloud SQL first.
      CHAT_MEMORY_ENABLED: ${{ vars.CHAT_MEMORY_ENABLED }}
      MAIL_MODE: ${{ vars.MAIL_MODE }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      SMTP_USER: ${{ vars.SMTP_USER }}
      DEMO_INBOXES: ${{ vars.DEMO_INBOXES }}
    steps:
      - if: inputs.skip_eval_gate
        run: echo "::warning::deploying WITHOUT the quality floor (skip_eval_gate was ticked)"
      - uses: actions/checkout@v4
      - id: tag
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/api:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - id: deploy
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          # CORS must allow every URL of factored-web (Cloud Run gives each service two).
          web=$(gcloud run services describe factored-web --project "$PROJECT" --region "$REGION" \
            --format='value(metadata.annotations."run.googleapis.com/urls")' 2>/dev/null | tr -d '[]" ' || true)
          gcloud run deploy factored-api --project "$PROJECT" --region "$REGION" \
            --image "$REGISTRY/api:$TAG" \
            --service-account "factored-api@${PROJECT}.iam.gserviceaccount.com" \
            --add-cloudsql-instances "${PROJECT}:${REGION}:${SQL_INSTANCE}" \
            --set-secrets "DATABASE_URL=factored-database-url:latest,JWT_SECRET=jwt-secret:latest,OPERATOR_KEY=operator-key:latest,LANGFUSE_PUBLIC_KEY=langfuse-public-key:latest,LANGFUSE_SECRET_KEY=langfuse-secret-key:latest,SMTP_PASSWORD=factored-smtp-password:latest" \
            --set-env-vars "^;^APP_ENV=cloud;GOOGLE_GENAI_USE_VERTEXAI=true;GOOGLE_CLOUD_PROJECT=${PROJECT};GOOGLE_CLOUD_LOCATION=${REGION};CORS_ORIGINS=${web:-http://localhost:3000};DEMO_CUSTOMER_IDS=${DEMO_IDS};ACTIONS_ENABLED=${ACTIONS_ENABLED:-false};KHIPU_ENABLED=${KHIPU_ENABLED:-false};CHAT_MEMORY_ENABLED=${CHAT_MEMORY_ENABLED:-false};MAIL_MODE=${MAIL_MODE:-simulated};MAIL_FROM=${MAIL_FROM:-};SMTP_USER=${SMTP_USER:-};DEMO_INBOXES=${DEMO_INBOXES:-};LANGFUSE_BASE_URL=https://us.cloud.langfuse.com" \
            --memory 4Gi --cpu 4 --cpu-boost --max-instances 1 --allow-unauthenticated
          url=$(gcloud run services describe factored-api --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$URL/health"; then exit 0; fi
            sleep 10
          done
          echo "factored-api did not answer /health at $URL" >&2
          exit 1

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          # The API URL is baked into the static bundle at build time.
          build-args: NEXT_PUBLIC_API_URL=${{ needs.deploy-api.outputs.url }}
          tags: ${{ env.REGISTRY }}/web:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - id: deploy
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          gcloud run deploy factored-web --project "$PROJECT" --region "$REGION" \
            --image "$REGISTRY/web:$TAG" --port 8080 --allow-unauthenticated
          url=$(gcloud run services describe factored-web --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # First deploy of the web (or a new URL): let the API accept it.
          web=$(gcloud run services describe factored-web --project "$PROJECT" --region "$REGION" \
            --format='value(metadata.annotations."run.googleapis.com/urls")' | tr -d '[]" ')
          gcloud run services update factored-api --project "$PROJECT" --region "$REGION" \
            --update-env-vars "^;^CORS_ORIGINS=$web"
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null "$URL/"; then exit 0; fi
            sleep 10
          done
          echo "factored-web did not answer at $URL" >&2
          exit 1
